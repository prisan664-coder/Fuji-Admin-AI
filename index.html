<!DOCTYPE html>
<html lang="lo" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Fuji Smart AI — ผู้ช่วย AI ร้านซ่อมมือถือ ตอบคำถาม 24 ชั่วโมง">
    <title>Fuji Smart AI v5.2 — ຮ້ານແປງໂທລະສັບຟູຈິ</title>

    <!-- Preload & Preconnect -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest"
        href="data:application/json,{%22name%22:%22Fuji%20Smart%20AI%22,%22short_name%22:%22Fuji%20AI%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23030712%22,%22theme_color%22:%22%2306b6d4%22}">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {sans: ['Noto Sans Lao', 'sans-serif'], tech: ['Space Grotesk', 'Noto Sans Lao', 'sans-serif']},
                    colors: {cyber: {900: '#030712', card: 'rgba(15, 23, 42, 0.75)', neon: '#00f0ff'}},
                    animation: {'glow-pulse': 'glowPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'float': 'float 6s ease-in-out infinite'},
                    keyframes: {
                        glowPulse: {'0%, 100%': {opacity: 0.8, filter: 'drop-shadow(0 0 8px rgba(0,240,255,0.6))'}, '50%': {opacity: 1, filter: 'drop-shadow(0 0 18px rgba(0,240,255,0.9))'}},
                        'float': {'0%, 100%': {transform: 'translateY(0px)'}, '50%': {transform: 'translateY(-6px)'}}
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 100%;
            transition: font-size 0.2s;
        }

        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background: #030712;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s;
        }

        html:not(.dark) body {
            background: #f1f5f9;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            color: #0f172a;
        }

        html:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        html:not(.dark) .glass-header {
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        html:not(.dark) .chat-bubble-ai {
            background: rgba(241, 245, 249, 0.95);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: #0f172a;
        }

        html:not(.dark) .chat-bubble-user {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff;
        }

        html:not(.dark) .text-slate-100,
        html:not(.dark) .text-slate-200 {
            color: #0f172a !important;
        }

        html:not(.dark) .text-slate-300 {
            color: #334155 !important;
        }

        html:not(.dark) .text-slate-400 {
            color: #64748b !important;
        }

        html:not(.dark) .text-slate-500 {
            color: #94a3b8 !important;
        }

        html:not(.dark) .text-white {
            color: #0f172a !important;
        }

        html:not(.dark) .bg-slate-950\/90,
        html:not(.dark) .bg-slate-950\/80,
        html:not(.dark) .bg-slate-950\/70,
        html:not(.dark) .bg-slate-950\/60 {
            background: rgba(255, 255, 255, 0.9) !important;
        }

        html:not(.dark) .bg-slate-900\/80,
        html:not(.dark) .bg-slate-900\/60 {
            background: rgba(241, 245, 249, 0.9) !important;
        }

        html:not(.dark) .bg-slate-800\/80,
        html:not(.dark) .bg-slate-800\/60 {
            background: rgba(226, 232, 240, 0.9) !important;
        }

        html:not(.dark) .bg-slate-800 {
            background: #e2e8f0 !important;
        }

        html:not(.dark) .border-slate-700\/80,
        html:not(.dark) .border-slate-700\/60,
        html:not(.dark) .border-slate-700 {
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        html:not(.dark) .border-slate-800\/80,
        html:not(.dark) .border-slate-800 {
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        html:not(.dark) #suggest-sheet {
            background: rgba(255, 255, 255, 0.95);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-bubble-user {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 4px 20px -2px rgba(99, 102, 241, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .chat-bubble-ai {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.4);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.8);
        }

        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
                filter: blur(4px);
            }

            60% {
                transform: translateY(-2px) scale(1.02);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .msg-animate {
            animation: messageIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .typing-cursor::after {
            content: '▊';
            animation: blink 0.8s infinite;
            color: #06b6d4;
            margin-left: 2px;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .gradient-animated {
            background: linear-gradient(270deg, #06b6d4, #8b5cf6, #ec4899, #06b6d4);
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        @keyframes bubbleGlow {
            0% {
                box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);
            }

            100% {
                box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
            }
        }

        .new-message {
            animation: bubbleGlow 1.5s ease-in-out;
        }

        *:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 2px;
            border-radius: 8px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .suggestion-btn {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .suggestion-btn:hover {
            border-left-color: #f59e0b;
            background: rgba(30, 41, 59, 0.95);
            transform: translateX(4px);
        }

        #scroll-bottom-btn {
            transition: opacity 0.2s, transform 0.2s;
        }

        #scroll-bottom-btn.hidden-btn {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        #sheet-backdrop {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        #sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        #suggest-sheet {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
            max-height: 80vh;
        }

        #suggest-sheet.open {
            transform: translateY(0);
        }

        .drag-handle {
            width: 40px;
            height: 4px;
            background: rgba(148, 163, 184, 0.5);
            border-radius: 9999px;
            margin: 8px auto 4px;
        }

        .faq-item-sheet {
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .faq-item-sheet:hover,
        .faq-item-sheet:active {
            border-left-color: #f59e0b;
            background: rgba(30, 41, 59, 0.95);
            transform: translateX(3px);
        }

        @keyframes badgePulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0);
            }
        }

        .badge-pulse {
            animation: badgePulse 2s infinite;
        }

        #particles {
            opacity: 0.3;
        }

        html:not(.dark) #particles {
            opacity: 0.15;
        }

        .recording {
            background: rgba(244, 63, 94, 0.3) !important;
            color: #fda4af !important;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(244, 63, 94, 0);
            }
        }

        .message-actions {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-bubble-ai:hover .message-actions,
        .chat-bubble-ai:focus-within .message-actions {
            opacity: 1;
        }

        .quick-reply {
            animation: chipIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        @keyframes chipIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body class="text-slate-100 flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <canvas id="particles" class="fixed inset-0 pointer-events-none z-0"></canvas>
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="sr-only" aria-live="polite" id="sr-announce"></div>

    <div
        class="w-full max-w-2xl h-[94vh] flex flex-col glass-panel rounded-3xl overflow-hidden relative border border-cyan-500/20 shadow-2xl z-10">

        <!-- Header -->
        <header class="glass-header px-3 py-2.5 sm:px-6 sm:py-4 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="relative animate-float">
                    <div
                        class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-cyan-400 via-indigo-500 to-pink-500 p-0.5 shadow-lg shadow-cyan-500/30">
                        <div
                            class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center overflow-hidden">
                            <i class="fa-solid fa-microchip text-cyan-400 text-lg sm:text-xl animate-glow-pulse"></i>
                        </div>
                    </div>
                    <span
                        class="absolute -bottom-0.5 -right-0.5 w-3 h-3 sm:w-3.5 sm:h-3.5 bg-emerald-400 border-2 border-slate-950 rounded-full shadow-sm shadow-emerald-400/80"></span>
                </div>
                <div>
                    <h1
                        class="font-extrabold text-xs sm:text-base md:text-lg gradient-animated tracking-tight leading-snug">
                        ແອດມິນເອໄອ ຮ້ານແປງໂທລະສັບຟູຈິ
                    </h1>
                    <div class="flex items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs text-slate-400 mt-0.5">
                        <span class="inline-flex items-center text-emerald-400 gap-1 font-medium">
                            <i class="fa-solid fa-bolt text-[9px] animate-pulse"></i> v5.2
                        </span>
                        <span class="hidden sm:inline">•</span>
                        <span class="hidden sm:flex text-slate-400 items-center gap-1">
                            <i class="fa-solid fa-user-shield text-indigo-400 text-[10px]"></i> ເຊດຊັນສ່ວນຕົວ
                        </span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-1 sm:space-x-2">
                <button onclick="openSuggestSheet()" id="hamburger-btn" aria-label="ເປີດລາຍການຄຳຖາມ"
                    class="relative p-2 sm:p-2.5 rounded-xl bg-gradient-to-r from-amber-500/20 to-orange-500/20 hover:from-amber-500/30 hover:to-orange-500/30 text-amber-300 border border-amber-500/40 transition active:scale-95">
                    <i class="fa-solid fa-bars text-sm sm:text-base"></i>
                    <span id="hamburger-badge"
                        class="absolute -top-1.5 -right-1.5 min-w-[18px] h-4 sm:min-w-[20px] sm:h-5 px-1 bg-amber-500 text-slate-900 text-[9px] sm:text-[10px] font-bold rounded-full flex items-center justify-center shadow-md badge-pulse">0</span>
                </button>
                <button onclick="toggleTheme()" id="theme-btn" aria-label="ປ່ຽນທີມ"
                    class="p-2 sm:p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-amber-400 transition border border-slate-700/60 active:scale-95">
                    <i id="theme-icon" class="fa-solid fa-sun text-sm sm:text-base"></i>
                </button>
                <button onclick="toggleAudio()" id="audio-btn" aria-label="ເປີດ/ປິດ ສຽງ"
                    class="p-2 sm:p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-cyan-400 transition border border-slate-700/60 active:scale-95">
                    <i id="audio-icon" class="fa-solid fa-volume-high text-cyan-400 text-sm sm:text-base"></i>
                </button>
                <button onclick="resetSession()" aria-label="ລ້າງແຊັດ"
                    class="hidden sm:block p-2 sm:p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-rose-400 transition border border-slate-700/60 active:scale-95">
                    <i class="fa-solid fa-arrows-rotate text-sm sm:text-base"></i>
                </button>
            </div>
        </header>

        <div
            class="bg-gradient-to-r from-cyan-950/40 via-slate-900/60 to-purple-950/40 border-b border-cyan-500/10 px-4 py-1.5 text-[10px] sm:text-xs text-cyan-200/80 flex items-center justify-center gap-2 text-center shrink-0">
            <i class="fa-solid fa-shield-halved text-cyan-400"></i>
            <span>ຂໍ້ຄວາມຈະບໍ່ຖືກບັນທຶກ ເມື່ອອອກຈາກໜ້າເວັບ</span>
        </div>

        <!-- Chat Stream -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-3 sm:space-y-4">
            <div class="flex items-start space-x-2 sm:space-x-3 msg-animate">
                <div
                    class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-md shadow-cyan-500/20 shrink-0 mt-1">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div
                    class="chat-bubble-ai rounded-2xl rounded-tl-none p-3 sm:p-4 max-w-[88%] text-slate-200 text-xs sm:text-sm leading-relaxed">
                    <div class="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-700/50">
                        <span class="font-bold text-cyan-400 flex items-center gap-1.5 text-[10px] sm:text-xs">
                            <i class="fa-solid fa-microchip text-xs"></i> Fuji Smart AI v5.2
                        </span>
                        <span
                            class="text-[9px] sm:text-[10px] bg-cyan-950/80 text-cyan-300 border border-cyan-800 px-1.5 sm:px-2 py-0.5 rounded-md font-mono">Ready</span>
                    </div>
                    <p class="mb-2">ສະບາຍດີ! ຍິນດີຕ້ອນຮັບສູ່ <b>ຮ້ານແປງໂທລະສັບຟູຈິ</b> 🛠️</p>
                    <p class="text-slate-300 mb-2">ພິມຄຳຖາມ ຫຼື ກົດປຸ່ມ <i class="fa-solid fa-bars text-amber-400"></i>
                        ເພື່ອເບິ່ງຄຳຖາມຍອດຮິດ ຫຼື <i class="fa-solid fa-microphone text-pink-400"></i> ເພື່ອພູດ.</p>
                    <span class="text-[10px] text-slate-500 block text-right mt-1" id="welcome-time"></span>
                </div>
            </div>
        </div>

        <!-- Scroll to Bottom -->
        <button id="scroll-bottom-btn" onclick="scrollToBottom(true)" aria-label="ໄປລຸ່ມສຸດ"
            class="hidden-btn absolute bottom-28 right-4 sm:right-6 w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-cyan-500 hover:bg-cyan-400 text-white shadow-lg shadow-cyan-500/40 z-10 flex items-center justify-center">
            <i class="fa-solid fa-arrow-down text-sm"></i>
        </button>

        <!-- Input Form -->
        <div class="p-2 sm:p-4 glass-header shrink-0">
            <form id="chat-form" onsubmit="handleUserInputSubmit(event)" class="flex items-center gap-1.5 sm:gap-2">
                <button type="button" onclick="toggleVoiceInput()" id="voice-btn" aria-label="ພູດ"
                    class="p-2.5 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-pink-400 transition border border-slate-700/60 active:scale-95 shrink-0">
                    <i class="fa-solid fa-microphone text-sm"></i>
                </button>
                <!-- ⭐ ลบ hidden sm:block ออก为了让มือถือเห็นปุ่มกล้อง -->
                <button type="button" onclick="capturePhoto()" aria-label="ຖ່າຍຮູບ"
                    class="p-2.5 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-emerald-400 transition border border-slate-700/60 active:scale-95 shrink-0">
                    <i class="fa-solid fa-camera text-sm"></i>
                </button>

                <div class="relative flex-1">
                    <input type="text" id="user-input" placeholder="ພິມຄຳຖາມ..." autocomplete="off" maxlength="500"
                        enterkeyhint="send"
                        class="w-full bg-slate-950/90 text-slate-100 placeholder-slate-500 text-xs sm:text-sm rounded-xl px-3 sm:px-4 py-2.5 sm:py-3 pr-12 sm:pr-14 border border-slate-700/80 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition shadow-inner">
                    <span id="char-count"
                        class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-[9px] sm:text-[10px] text-slate-500 pointer-events-none">0/500</span>
                    <span id="feedback-badge"
                        class="hidden absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-[9px] sm:text-[10px] bg-pink-500/20 text-pink-300 border border-pink-500/40 px-2 py-1 rounded-md font-medium flex items-center gap-1">
                        <i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">ໂໝດສົ່ງຄຳຄິດເຫັນ</span>
                    </span>

    <script type="module">

        const firebaseConfig = {
            apiKey: "AIzaSyCPlKQmGJZxWaea_6y-h5lRGL5PSGw861M",

        const app = initializeApp(firebaseConfig);

        // ⚙️ CONFIG

        const SEA_LION_API_KEY = 'sk-_oaOxH3pEQxRCIZ-sSCdHA';

        const SEA_LION_MODEL = 'aisingapore/Qwen-SEA-LION-v4.5-27B-IT';

        const ENABLE_PARTICLES = true;
        const ENABLE_STREAMING = true;
        const ENABLE_HAPTIC = true;

        const FEEDBACK_SPECIAL_QUESTION = "ລູກຄ້າຕ້ອງການປະກອບຄວາມຄິດເຫັນເຖິງຜູ້ພັດທະນາໂປຣແກມບໍ ສາມາດພິມຂໍ້ຄວາມແລະສົ່ງໄດ້ທາງນີ້";

        const DEFAULT_FAQS = [
            {question: "ຮ້ານຕັ້ງຢູ່ໃສ ແລະ ເປີດຈັກໂມງ?", answer: "📍 **ຮ້ານແປງໂທລະສັບຟູຈິ** ຕັ້ງຢູ່ແຄມທາງໃຫຍ່ ໃກ້ຕະຫຼາດດົງໂດກ.<br>⏰ ເປີດທຸກມື້: **08:30 - 19:00**.<br>🌐 ເບິ່ງແຜນທີ່: https://maps.google.com", isPinned: true, usageCount: 0},
            {question: "ປ່ຽນໜ້າຈໍໂທລະສັບ ໃຊ້ເວລາດົນປານໃດ?", answer: "📱 ປ່ຽນໜ້າຈໍໃຊ້ເວລາ **30 - 60 ນາທີ** ຂຶ້ນກັບລຸ້ນໂທລະສັບ.", isPinned: true, usageCount: 0},
            {question: "ມີປະກັນຫຼັງການແປງບໍ?", answer: "🛡️ ມີຮັບປະກັນອາໄຫຼ່ ແລະ ການແປງ **30 - 90 ມື້**.", isPinned: false, usageCount: 0},
            {question: "ປ່ຽນແບັດເຕີຣີ ລາຄາເທົ່າໃດ?", answer: "🔋 ເລີ່ມ **120,000 ກີບ** ຮັບປະກັນແບັດເຕີຣີ 6 ເດືອນ.", isPinned: false, usageCount: 0},
            {question: "ໂທລະສັບຕົກນ້ຳ ແປງໄດ້ບໍ?", answer: "💧 ແປງໄດ້! ຟ້າວນຳມາຮ້ານ ຢ່າສຽບສາຍຊາດ ຫຼື ເປີດເຄື່ອງ.", isPinned: false, usageCount: 0},
        ];

        // ===== STATE =====
        let allFAQs = [];
        let visibleFAQs = [];
        let isFeedbackActive = false;
        // 🌟 โหลดค่าการเปิดปิดเสียงจาก localStorage (ถ้าไม่เคยตั้งให้เปิดเป็นค่าเริ่มต้น)
        let isAudioEnabled = localStorage.getItem('fuji_audio') !== 'false';
        let sessionContext = {lastBrand: null, lastTopic: null};
        const usageCooldown = new Map();
        const rateLimitTimestamps = [];
        window.__faqCache = {};
        let audioCtx = null;
        let currentSheetSearch = '';
        let recognition = null;
        let isRecording = false;
        let lastUserMessage = '';
        let lastAiMessage = '';
        let isProcessing = false; // 🌟 ตัวแปรป้องกันการกดส่งซ้ำ (ช่วยไม่ให้ iPhone ค้าง)

        // ===== HAPTIC =====
        function haptic(type = 'light') {
            if (!ENABLE_HAPTIC || !navigator.vibrate) return;
            const patterns = {light: [10], medium: [20], heavy: [30], success: [10, 50, 10], error: [30, 50, 30]};
            try {navigator.vibrate(patterns[type] || [10]);} catch (e) { }
        }

        // ===== SCREEN READER =====
        function announce(msg) {
            const el = document.getElementById('sr-announce');
            if (el) el.textContent = msg;
        }

        // ===== THEME =====
        window.toggleTheme = function () {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-sm sm:text-base' : 'fa-solid fa-moon text-sm sm:text-base';
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.content = isDark ? '#030712' : '#f1f5f9';
            haptic('light');
            showToast(isDark ? '🌙 ໂໝດມືດ' : '☀️ ໂໝດແຈ້ງ');
        };

        (function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon text-sm sm:text-base';
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) metaTheme.content = '#f1f5f9';
            }
        })();

        // ===== FONT SIZE =====
        let fontSizeLevel = parseInt(localStorage.getItem('fontSize') || '100');
        window.changeFontSize = function (delta) {
            fontSizeLevel = Math.max(80, Math.min(140, fontSizeLevel + delta * 10));
            document.documentElement.style.fontSize = fontSizeLevel + '%';
            localStorage.setItem('fontSize', fontSizeLevel);
            haptic('light');
            showToast(`🔤 ຂະໜາດ ${fontSizeLevel}%`);
        };
        document.documentElement.style.fontSize = fontSizeLevel + '%';

        // ===== AUDIO =====
        function getAudioCtx() {
            if (!audioCtx) {
                try {audioCtx = new (window.AudioContext || window.webkitAudioContext)();}
                catch (e) {return null;}
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'send') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'receive') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'toast') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'type') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random() * 400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.02, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                    osc.start(); osc.stop(ctx.currentTime + 0.03);
                }
            } catch (e) { }
        }

        window.toggleAudio = function () {
            isAudioEnabled = !isAudioEnabled;
            localStorage.setItem('fuji_audio', isAudioEnabled); // บันทึกการตั้งค่า
            const icon = document.getElementById('audio-icon');
            if (isAudioEnabled) {icon.className = "fa-solid fa-volume-high text-cyan-400 text-sm sm:text-base"; showToast("🔊 ເປີດສຽງ");}
            else {icon.className = "fa-solid fa-volume-xmark text-slate-500 text-sm sm:text-base"; showToast("🔇 ປິດສຽງ");}
            haptic('light');
        };

        // อัปเดตไอคอนเสียงให้ตรงกับค่าที่บันทึกไว้
        if (!isAudioEnabled) {
            document.getElementById('audio-icon').className = "fa-solid fa-volume-xmark text-slate-500 text-sm sm:text-base";
        }

        window.resetSession = function () {
            if (!confirm('ລ້າງແຊັດ?')) return;
            sessionContext = {lastBrand: null, lastTopic: null};
            usageCooldown.clear(); rateLimitTimestamps.length = 0;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = `
                <div class="flex items-start space-x-2 sm:space-x-3 msg-animate">
                    <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-md shrink-0 mt-1"><i class="fa-solid fa-robot"></i></div>
                    <div class="chat-bubble-ai rounded-2xl rounded-tl-none p-3 sm:p-4 max-w-[88%] text-slate-200 text-xs sm:text-sm">
                        <p class="mb-1">🔄 <b>ລ້າງແຊັດແລ້ວ!</b></p><p class="text-slate-300">ພິມຄຳຖາມໃໝ່ໄດ້ເລີຍ.</p>
                    </div>
                </div>`;
            deactivateFeedbackPrompt(); sessionStorage.removeItem('fuji_chat_history');
            haptic('success'); showToast("🔄 ລ້າງແຊັດແລ້ວ");
        };

        document.getElementById('welcome-time').innerText = getCurrentTime();

        // ===== PARTICLES =====
        if (ENABLE_PARTICLES) {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {canvas.width = window.innerWidth; canvas.height = window.innerHeight;}
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
            // ลดจำนวน particle ลงเล็กน้อยเพื่อประสิทธิภาพบนมือถือ
            const particles = Array.from({length: 20}, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 2 + 1, color: Math.random() > 0.5 ? 'rgba(6, 182, 212, 0.5)' : 'rgba(139, 92, 246, 0.5)'
            }));
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
                });
                requestAnimationFrame(animateParticles);
            }
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) animateParticles();
        }

        // ===== FIREBASE =====
        const faqsRef = ref(db, 'faqs');
        onValue(faqsRef, (snapshot) => {
            try {
                const data = snapshot.val();
                allFAQs = []; visibleFAQs = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        const d = data[key];
                        const q = d.question || d.q || '';
                        const a = d.answer || d.a || '';

                            const faq = {id: key, question: q, answer: a, isPinned: d.isPinned === true, category: d.category || 'ທົ່ວໄປ', usageCount: d.usageCount || 0};
                            allFAQs.push(faq);
                            if (faq.isPinned) visibleFAQs.push(faq);
                        }
                    });
                }
                if (allFAQs.length === 0) {
                    allFAQs = DEFAULT_FAQS.map((f, i) => ({...f, id: 'default-' + i, category: 'ທົ່ວໄປ'}));

                }
                visibleFAQs.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
                updateHamburgerBadge(); renderSheetFAQs();
            } catch (e) {
                console.error('FAQ parse error:', e);
                allFAQs = DEFAULT_FAQS.map((f, i) => ({...f, id: 'default-' + i, category: 'ທົ່ວໄປ'}));
                visibleFAQs = allFAQs.filter(f => f.isPinned === true);
                updateHamburgerBadge(); renderSheetFAQs();
            }
        }, (err) => {
            console.warn("Firebase failed:", err);
            allFAQs = DEFAULT_FAQS.map((f, i) => ({...f, id: 'default-' + i, category: 'ທົ່ວໄປ'}));
            visibleFAQs = allFAQs.filter(f => f.isPinned === true);
            updateHamburgerBadge(); renderSheetFAQs();

        function updateHamburgerBadge() {
            const badge = document.getElementById('hamburger-badge');

            if (count === 0) badge.classList.add('hidden'); else badge.classList.remove('hidden');

            playSound('toast'); haptic('light');

            document.body.style.overflow = 'hidden';
            setTimeout(() => document.getElementById('sheet-search').focus(), 350);
            renderSheetFAQs();
        };

        window.closeSuggestSheet = function () {
            document.getElementById('sheet-backdrop').classList.remove('open');
            document.getElementById('suggest-sheet').classList.remove('open');
            document.body.style.overflow = '';
            document.getElementById('sheet-search').value = '';
            document.getElementById('sheet-search-clear').classList.add('hidden');
            currentSheetSearch = '';
        };

        window.filterSheetFAQs = function () {
            const val = document.getElementById('sheet-search').value.trim();
            currentSheetSearch = val.toLowerCase();
            document.getElementById('sheet-search-clear').classList.toggle('hidden', !val);
            renderSheetFAQs();
        };

        window.clearSheetSearch = function () {
            document.getElementById('sheet-search').value = '';
            document.getElementById('sheet-search-clear').classList.add('hidden');
            currentSheetSearch = '';
            renderSheetFAQs();
            document.getElementById('sheet-search').focus();
        };

        function renderSheetFAQs() {
            const container = document.getElementById('sheet-faq-list');
            const countEl = document.getElementById('sheet-faq-count');

            if (visibleFAQs.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500 italic"><i class="fa-solid fa-magnifying-glass text-amber-400/60 mb-2 text-2xl"></i><br>ຍັງບໍ່ມີຄຳຖາມຍອດຮິດ<br><span class="text-slate-600 text-[10px]">ພິມຄຳຖາມຂອງທ່ານໄດ້ເລີຍ</span></div>`;
                countEl.innerText = "0 ຄຳຖາມ"; return;
            }

            const filtered = currentSheetSearch ? visibleFAQs.filter(f => f.question.toLowerCase().includes(currentSheetSearch) || (f.category && f.category.toLowerCase().includes(currentSheetSearch))) : visibleFAQs;

        // ===== NLP MATCHING =====
        function cleanLaoString(str) {return (str || '').toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"“”]/g, "").trim();}
        function extractEntities(text) {
            const lower = text.toLowerCase();
            const brands = ['iphone', 'ipad', 'apple', 'samsung', 'galaxy', 'oppo', 'vivo', 'xiaomi', 'redmi', 'poco', 'huawei', 'honor', 'realme', 'oneplus', 'infinix', 'tecno', 'nokia'];
            const topics = ['ຈໍ', 'ໜ້າຈໍ', 'ແບັດ', 'ແບັດເຕີຣີ', 'ລຳໂພງ', 'ກ້ອງ', 'ໄມໂຄ', 'ປຸ່ມ', 'ພອດ', 'ຊາດ', 'ສາຍຊາດ', 'ຊ້າ', 'ຄ້າງ', 'ດັບ', 'ບູດ', 'wifi', 'bluetooth', 'ສັນຍານ', 'ເນັດ', 'ລາຄາ', 'ປະກັນ', 'ເວລາ', 'ທີ່ຢູ່', 'ເປີດ', 'ຕົກນ້ຳ', 'ແຕກ', 'ບວມ'];
            let foundBrand = null, foundTopic = null;
            brands.forEach(b => {if (lower.includes(b)) foundBrand = b;});
            topics.forEach(t => {if (lower.includes(t)) foundTopic = t;});
            return {foundBrand, foundTopic};
        }
        function computeCharOverlap(str1, str2) {
            if (!str1 || !str2) return 0; let matches = 0; const maxLen = Math.max(str1.length, str2.length); if (maxLen === 0) return 0;
            for (let i = 0; i < str1.length - 1; i++) {const sub = str1.substring(i, i + 2); if (str2.includes(sub)) matches++;}
            return matches / Math.max(1, str1.length - 1);
        }
        function calculateAdvancedScore(userInputText, faqQuestionText) {
            const cleanUser = cleanLaoString(userInputText); const cleanFAQ = cleanLaoString(faqQuestionText);
            if (!cleanUser || !cleanFAQ) return 0;
            if (cleanFAQ.includes(cleanUser) || cleanUser.includes(cleanFAQ)) return 0.95;
            const userTokens = cleanUser.split(/\s+/).filter(t => t.length > 1); let tokenMatchCount = 0;
            if (userTokens.length > 0) userTokens.forEach(token => {if (cleanFAQ.includes(token)) tokenMatchCount++;});
            const matchRatio = userTokens.length > 0 ? (tokenMatchCount / userTokens.length) : 0;
            const charOverlapScore = computeCharOverlap(cleanUser, cleanFAQ);
            const {foundBrand: uBrand, foundTopic: uTopic} = extractEntities(userInputText);
            const {foundBrand: fBrand, foundTopic: fTopic} = extractEntities(faqQuestionText);
            let entityBonus = 0, penalty = 0;
            if (uBrand && fBrand) {if (uBrand === fBrand) entityBonus += 0.15; else penalty += 0.3;}
            if (uTopic && fTopic) {if (uTopic === fTopic) entityBonus += 0.15; else penalty += 0.2;}
            return Math.max(0, Math.min((matchRatio * 0.35) + (charOverlapScore * 0.35) + entityBonus - penalty, 1.0));
        }
        function queryUltraSmartAI(queryText) {
            let entities = extractEntities(queryText);
            if (!entities.foundBrand && sessionContext.lastBrand) entities.foundBrand = sessionContext.lastBrand;
            if (!entities.foundTopic && sessionContext.lastTopic) entities.foundTopic = sessionContext.lastTopic;
            if (entities.foundBrand) sessionContext.lastBrand = entities.foundBrand;
            if (entities.foundTopic) sessionContext.lastTopic = entities.foundTopic;
            let bestMatch = null, maxScore = 0; const scoredList = [];
            allFAQs.forEach(faq => {
                let score = calculateAdvancedScore(queryText, faq.question);
                const faqEntities = extractEntities(faq.question);
                if (sessionContext.lastBrand && faqEntities.foundBrand === sessionContext.lastBrand) score += 0.1;
                if (sessionContext.lastTopic && faqEntities.foundTopic === sessionContext.lastTopic) score += 0.1;
                score = Math.min(score, 1); scoredList.push({faq, score});
                if (score > maxScore) {maxScore = score; bestMatch = faq;}
            });
            scoredList.sort((a, b) => b.score - a.score);
            return {bestMatch, score: maxScore, topSuggestions: scoredList.slice(0, 3).filter(i => i.score > 0.05).map(i => i.faq)};
        }

                            {role: 'system', content: systemPrompt},
                            {role: 'user', content: userQuestion}
                        ],
                        temperature: 0.1, // 🔥 ลดอุณหภูมิลงให้ AI ตอบตรงประเด็น ไม่คิดพล่อย
                        max_tokens: 300,  // 🔥 จำกัดความยาวคำตอบ ไม่ให้เวิ่นเว้อ
                        top_p: 0.8
                    })
                });

                if (!response.ok) {
                    console.warn('SEA-LION error:', response.status);
                    return null;
                }

                const data = await response.json();
                let aiText = data.choices?.[0]?.message?.content || null;

                // ถ้า AI ดันตอบว่าหาข้อมูลไม่พบ ให้ส่ง null กลับไปเพื่อให้ระบบเดิมจัดการ (ขึ้นปุ่มแนะนำ FAQ)
                if (aiText && (aiText.includes("ບໍ່ພົບຂໍ້ມູນ") || aiText.includes("ບໍ່ພົບຂໍ້ມູນທີ່ພຽງພໍ"))) {
                    return null;
                }

                return aiText;
            } catch (err) {
                console.warn('SEA-LION fetch failed:', err);
                return null;
            }
        }

        // ===== MAIN HANDLER =====
        window.handleUserInputSubmit = async function (e) {
            e.preventDefault();

            // 🌟 ป้องกันการกดส่งรัวๆ (เป็นสาเหตุให้ iPhone ค้าง)
            if (isProcessing) return;

            const input = document.getElementById('user-input');
            const typedText = input.value.trim();
            if (!typedText) return;
            if (typedText.length > MAX_INPUT_LENGTH) {showToast(`⚠️ ຍາວເກີນ ${MAX_INPUT_LENGTH} ຕົວ`); return;}
            if (!/[\u0E80-\u0EFF\u0E00-\u0E7Fa-zA-Z0-9]/.test(typedText)) {showToast('⚠️ ກະລຸນາພິມຂໍ້ຄວາມ'); return;}

            isProcessing = true; // ล็อคการทำงาน

            const lowerText = typedText.toLowerCase();
            lastUserMessage = typedText;

            const farewellRegex = /^(ບໍ່ມີ|ບໍ່ມີແລ້ວ|ບໍ່ມີຫຍັງ|ພໍແລ້ວ|ຈົບແລ້ວ|ບໍ່|ຂອບໃຈ|ຂອບຄຸນ|thank you|thanks|thank)$/i;
            const isFarewell = farewellRegex.test(typedText.trim()) || (lowerText.includes('ຂອບໃຈ') && !isQuestion(lowerText) && lowerText.length < 30);

            if (isFarewell) {
                if (!checkRateLimit()) {isProcessing = false; return;}
                haptic('light'); playSound('send'); appendUserMessage(typedText); input.value = ''; updateCharCount(); showTypingIndicator();
                setTimeout(() => {
                    removeTypingIndicator(); playSound('receive'); haptic('success');
                    appendAIMessage(`<div class="text-center py-2"><div class="w-12 h-12 bg-gradient-to-br from-pink-500 to-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-pink-500/30"><i class="fa-solid fa-heart text-white text-xl"></i></div><p class="font-bold text-pink-300 text-sm mb-1">ຂອບໃຈຫຼາຍໆ! 💖</p><p class="text-xs text-slate-300 leading-relaxed">ຍິນດີທີ່ໄດ້ບໍລິການທ່ານ 🙏</p></div>`);
                    isProcessing = false; // ปลดล็อค
                }, 400);
                return;
            }

            const isFeedbackKeyword = lowerText.includes("ຄວາມຄິດເຫັນ") || lowerText.includes("ຜູ້ພັດທະນາ") || lowerText.includes("feedback") || lowerText.includes("ສະເໜີ");
            if (isFeedbackActive || isFeedbackKeyword) {
                await sendFeedbackToFirebase(typedText); input.value = ''; updateCharCount(); isProcessing = false; return;
            }

            if (!checkRateLimit()) {isProcessing = false; return;}
            haptic('light'); playSound('send'); appendUserMessage(typedText); input.value = ''; updateCharCount(); showTypingIndicator();
            const emotion = detectEmotion(typedText);

            setTimeout(async () => {
                removeTypingIndicator(); playSound('receive'); haptic('success');

                if (emotion === 'angry') {
                    appendAIMessage(`<div class="p-1 leading-relaxed"><p class="text-slate-200 text-xs sm:text-sm mb-2">💡 <b>ທາງຮ້ານຂໍຮັບປະກັນວ່າຈະບໍ່ປ່ອຍຜ່ານເລື່ອງນີ້ໄປງ່າຍໆ.</b> ຂໍສົ່ງຕໍ່ໃຫ້ <b>ຜູ້ຈັດການຮ້ານ</b> ຕິດຕໍ່ກັບທ່ານໂດຍກົງ.</p><button onclick="activateFeedbackPrompt()" class="w-full text-left bg-gradient-to-r from-pink-950/80 to-purple-950/80 hover:from-pink-900 hover:to-purple-900 text-pink-200 border border-pink-500/50 p-2.5 rounded-lg text-xs font-medium transition flex items-center gap-2 active:scale-95 shadow-md"><i class="fa-solid fa-paper-plane text-pink-400"></i><span>ພິມບັນຫາ ພ້ອມເບີໂທ</span></button></div>`); isProcessing = false; return;
                }
                if (emotion === 'happy') {
                    appendAIMessage(`<div class="p-1 leading-relaxed text-center"><div class="w-14 h-14 bg-gradient-to-br from-emerald-400 via-cyan-500 to-blue-500 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg shadow-emerald-500/40 animate-pulse"><i class="fa-solid fa-face-laugh-beam text-white text-2xl"></i></div><p class="font-bold text-emerald-300 text-sm mb-2">ດີໃຈນຳຫຼາຍໆ! 🎉</p><p class="text-slate-200 text-xs sm:text-sm leading-relaxed">ຂອບໃຈສຳລັບຄຳດີໆ 💖</p></div>`); isProcessing = false; return;
                }
                if (emotion === 'sad') {
                    appendAIMessage(`<div class="p-1 leading-relaxed text-center"><div class="w-14 h-14 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg shadow-purple-500/40 animate-pulse"><i class="fa-solid fa-hand-holding-heart text-white text-2xl"></i></div><p class="font-bold text-purple-300 text-sm mb-2">ຂ້ອຍຢູ່ນີ້ ພ້ອມຟັງ 💜</p><p class="text-slate-200 text-xs sm:text-sm mb-3 leading-relaxed">ທ່ານບໍ່ໄດ້ຢູ່ຄົນດຽວ 🥺</p><button onclick="activateFeedbackPrompt()" class="w-full bg-gradient-to-r from-indigo-950/80 to-purple-950/80 text-purple-200 border border-purple-500/50 p-3 rounded-xl text-xs font-medium flex items-center justify-center gap-2 active:scale-95"><i class="fa-solid fa-comment-dots text-purple-400"></i><span>ລະບາຍຄວາມຮູ້ສຶກ</span></button></div>`); isProcessing = false; return;
                }

                // NEUTRAL
                const aiResult = queryUltraSmartAI(typedText);
                const followUpHTML = '<div class="mt-2 pt-2 border-t border-slate-700/50 text-cyan-300 text-[10px] sm:text-xs"><i class="fa-regular fa-circle-question mr-1"></i> ມີຫຍັງໃຫ້ຊ່ວຍເພີ່ມເຕີມບໍ?</div>';

                if (aiResult.score >= MATCH_THRESHOLD && aiResult.bestMatch) {
                    const formattedAnswer = autoLinkify(aiResult.bestMatch.answer);
                    lastAiMessage = formattedAnswer;
                    const fullHtml = `<div class="mb-2 text-cyan-300 font-semibold text-xs flex items-center gap-1.5"><i class="fa-solid fa-circle-check text-emerald-400"></i> ຄຳຕອບ:</div><div class="text-slate-200">${formattedAnswer}</div>${followUpHTML}`;
                    if (ENABLE_STREAMING && formattedAnswer.length < 500) await typeMessage(fullHtml); else appendAIMessage(fullHtml);
                    incrementUsage(aiResult.bestMatch.id);
                    appendQuickReplies(['ລາຄາເທົ່າໃດ?', 'ໃຊ້ເວລາດົນບໍ?', 'ມີປະກັນບໍ?']);
                    isProcessing = false; // ปลดล็อค
                }
                // 🌟 กรณีที่เจอ FAQ ใกล้เคียง -> ให้ SEA-LION ช่วยอ่านและสรุป
                else if (aiResult.topSuggestions.length > 0) {
                    showTypingIndicator();
                    const aiSummary = await askSeaLionToSummarize(typedText, aiResult.topSuggestions);
                    removeTypingIndicator();

                    if (aiSummary && !aiSummary.includes("ບໍ່ພົບຂໍ້ມູນທີ່ພຽງພໍ")) {
                        const formatted = autoLinkify(aiSummary);
                        lastAiMessage = formatted;
                        const fullHtml = `<div class="mb-2 text-cyan-300 font-semibold text-xs flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> ຄຳຕອບ (ສະຫຼຸບໂດຍ AI):</div><div class="text-slate-200">${formatted}</div>${followUpHTML}`;
                        await typeMessage(fullHtml);
                        announce('AI ຕອບກັບແລ້ວ');
                    } else {
                        await logUnansweredQuery(typedText, aiResult, emotion);
                        let html = `<div class="text-amber-300 mb-3 flex items-start gap-2"><i class="fa-solid fa-circle-info mt-1 text-sm"></i><div><p class="font-bold text-sm">ເອໄອພົບຫົວຂໍ້ໃກ້ຄຽງ</p><p class="text-xs text-slate-400 mt-0.5">ທ່ານໝາຍເຖິງຄຳຖາມເຫຼົ່ານີ້ບໍ?</p></div></div><div class="space-y-2">`;
                        aiResult.topSuggestions.forEach((sugg, index) => {
                            window.__faqCache[sugg.id] = {question: sugg.question, answer: sugg.answer};
                            html += `<button class="suggestion-btn w-full text-left bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 rounded-xl p-3 flex items-center justify-between group transition" onclick="handleSelectFAQById('${sugg.id}')"><div class="flex items-center gap-2 overflow-hidden pr-2"><span class="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px] shrink-0 font-bold">${index + 1}</span><span class="text-xs font-medium text-slate-200 truncate group-hover:text-amber-300 transition-colors">${escapeHtml(sugg.question)}</span></div><i class="fa-solid fa-chevron-right text-slate-500 text-xs group-hover:translate-x-1 group-hover:text-amber-400 transition-all shrink-0"></i></button>`;
                        });
                        html += `</div>`; appendAIMessage(html);
                    }
                    isProcessing = false; // ปลดล็อค
                }
                else {
                    await logUnansweredQuery(typedText, aiResult, emotion);
                    appendAIMessage(`<div class="text-slate-300"><p class="mb-2">⚠️ ຂໍອະໄພ, ບໍ່ພົບຂໍ້ມູນທີ່ກົງກັບ <b>"${escapeHtml(typedText)}"</b>.</p><p class="text-xs text-slate-400 mb-3">ຂໍ້ຄວາມຖືກສົ່ງໃຫ້ທີມງານແລ້ວ 🙏</p><button onclick="activateFeedbackPrompt()" class="text-xs bg-pink-500/20 hover:bg-pink-500/30 text-pink-300 border border-pink-500/40 px-3 py-2 rounded-xl transition flex items-center gap-2 font-medium"><i class="fa-solid fa-paper-plane"></i> ຝາກຂໍ້ຄວາມ</button></div>`);
                    isProcessing = false; // ปลดล็อค
                }
            }, 500);
        };

        async function sendFeedbackToFirebase(message) {
            if (!checkRateLimit()) return;
            haptic('light'); playSound('send'); appendUserMessage(message); showTypingIndicator();
            try {
                const newRef = push(ref(db, 'developer_feedback'));
                await set(newRef, {message, timestamp: new Date().toISOString(), device: navigator.userAgent.substring(0, 80)});
                setTimeout(() => {
                    removeTypingIndicator(); playSound('toast'); haptic('success');
                    appendAIMessage("✅ <b>ສົ່ງຮຽບຮ້ອຍແລ້ວ!</b><br>ຂອບໃຈຫຼາຍໆ 🙏"); deactivateFeedbackPrompt(); showToast("✅ ສົ່ງສຳເລັດ");
                }, 500);
            } catch (err) {
                setTimeout(() => {removeTypingIndicator(); appendAIMessage("❌ ເກີດຂໍ້ຜິດພາດ. ລອງໃໝ່."); deactivateFeedbackPrompt();}, 500);
            }
        }

        // ===== UI HELPERS =====
        function appendUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div'); div.className = "flex items-start justify-end space-x-2 sm:space-x-3 msg-animate";
            div.innerHTML = `<div class="chat-bubble-user rounded-2xl rounded-tr-none p-3 sm:p-3.5 max-w-[85%] text-white text-xs sm:text-sm"><p class="whitespace-pre-wrap">${escapeHtml(text)}</p><span class="text-[10px] text-indigo-200/70 block text-right mt-1">${getCurrentTime()}</span></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-md shrink-0 mt-1"><i class="fa-solid fa-user"></i></div>`;
            chatBox.appendChild(div); scrollToBottomSmart();
        }

        function appendAIMessage(htmlContent, plainText = '') {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div'); div.className = "flex items-start space-x-2 sm:space-x-3 msg-animate";
            const textForCopy = plainText || stripHtml(htmlContent);
            div.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-md shrink-0 mt-1"><i class="fa-solid fa-robot"></i></div><div class="chat-bubble-ai rounded-2xl rounded-tl-none p-3 sm:p-4 max-w-[88%] text-slate-200 text-xs sm:text-sm leading-relaxed new-message group"><div class="ai-content">${htmlContent}</div><div class="message-actions flex gap-1 mt-2"><button onclick="copyMessage(\`${escapeJs(textForCopy)}\`)" class="text-[10px] text-slate-400 hover:text-cyan-400 px-2 py-1 rounded transition"><i class="fa-solid fa-copy mr-1"></i>copy</button></div><span class="text-[10px] text-slate-500 block text-right mt-1.5">${getCurrentTime()}</span></div>`;
            chatBox.appendChild(div); scrollToBottomSmart();
            setTimeout(() => div.querySelector('.new-message')?.classList.remove('new-message'), 1600); announce('AI ຕອບກັບແລ້ວ');
        }

        async function typeMessage(htmlContent) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div'); div.className = "flex items-start space-x-2 sm:space-x-3 msg-animate";
            div.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-1"><i class="fa-solid fa-robot"></i></div><div class="chat-bubble-ai rounded-2xl rounded-tl-none p-3 sm:p-4 max-w-[88%] text-slate-200 text-xs sm:text-sm leading-relaxed"><div class="typed-content typing-cursor"></div><span class="text-[10px] text-slate-500 block text-right mt-1.5">${getCurrentTime()}</span></div>`;
            chatBox.appendChild(div);
            const target = div.querySelector('.typed-content');
            const tempDiv = document.createElement('div'); tempDiv.innerHTML = htmlContent;
            const plainText = tempDiv.textContent || '';
            for (let i = 0; i < plainText.length; i++) {
                target.textContent = plainText.substring(0, i + 1);
                if (i % 5 === 0) playSound('type');
                if (i % 3 === 0) await new Promise(r => setTimeout(r, 12));
                if (i % 10 === 0) scrollToBottomSmart();
            }
            target.innerHTML = htmlContent; target.classList.remove('typing-cursor');
            scrollToBottomSmart(); announce('AI ຕອບກັບແລ້ວ');
        }

        function appendQuickReplies(suggestions) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div'); div.className = "ml-9 sm:ml-11 flex flex-wrap gap-1.5 sm:gap-2";
            div.innerHTML = suggestions.map((s, i) => `<button onclick="document.getElementById('user-input').value='${escapeJs(s)}'; document.getElementById('chat-form').requestSubmit();" class="quick-reply text-[10px] sm:text-[11px] bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2.5 sm:px-3 py-1.5 rounded-full transition active:scale-95" style="animation-delay: ${i * 80}ms">${escapeHtml(s)}</button>`).join('');
            chatBox.appendChild(div); scrollToBottomSmart();
        }

        window.copyMessage = function (text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {showToast('📋 copy ແລ້ວ'); haptic('light');}).catch(() => showToast('❌ copy ບໍ່ໄດ້'));
            }
        };

        function stripHtml(html) {const tmp = document.createElement('div'); tmp.innerHTML = html; return tmp.textContent || '';}
        function escapeJs(str) {return String(str).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');}

        function showTypingIndicator() {
            if (document.getElementById('typing-indicator')) return; // Prevent duplicate
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div'); div.id = 'typing-indicator'; div.className = "flex items-start space-x-2 sm:space-x-3 msg-animate";
            div.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-1"><i class="fa-solid fa-robot animate-pulse"></i></div><div class="chat-bubble-ai rounded-2xl rounded-tl-none px-3 sm:px-4 py-2.5 sm:py-3 text-cyan-400 text-xs flex items-center space-x-1.5"><span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.2s]"></span><span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.4s]"></span><span class="text-slate-400 text-[10px] sm:text-[11px] ml-2">AI v5.2 ກຳລັງຄິດ...</span></div>`;
            chatBox.appendChild(div); scrollToBottomSmart();
        }

        function removeTypingIndicator() {document.getElementById('typing-indicator')?.remove();}

        function scrollToBottomSmart() {
            const chatBox = document.getElementById('chat-box');
            const isNearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 150;
            if (isNearBottom) {chatBox.scrollTo({top: chatBox.scrollHeight, behavior: 'smooth'}); document.getElementById('scroll-bottom-btn').classList.add('hidden-btn');}
            else {document.getElementById('scroll-bottom-btn').classList.remove('hidden-btn');}
        }

        window.scrollToBottom = function (force = false) {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTo({top: chatBox.scrollHeight, behavior: 'smooth'});
            document.getElementById('scroll-bottom-btn').classList.add('hidden-btn');
        };

        document.getElementById('chat-box').addEventListener('scroll', (e) => {
            const box = e.target;
            const isNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 150;
            document.getElementById('scroll-bottom-btn').classList.toggle('hidden-btn', isNearBottom);
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-[-160%]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100');
            clearTimeout(window.__toastTimeout);
            window.__toastTimeout = setTimeout(() => {toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-160%]', 'opacity-0');}, 3000);
        }

        function getCurrentTime() {return new Date().toLocaleTimeString('lo-LA', {hour: '2-digit', minute: '2-digit'});}
        function escapeHtml(str) {if (!str) return ''; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");}

        function updateCharCount() {
            const input = document.getElementById('user-input');
            const counter = document.getElementById('char-count');
            const len = input.value.length;
            counter.innerText = `${len}/${MAX_INPUT_LENGTH}`;
            counter.className = len > MAX_INPUT_LENGTH * 0.9 ? 'absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-[9px] sm:text-[10px] text-rose-400 pointer-events-none' : 'absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-[9px] sm:text-[10px] text-slate-500 pointer-events-none';
        }
        document.getElementById('user-input').addEventListener('input', updateCharCount);

        // ===== SESSION PERSISTENCE =====
        function saveSession() {
            try {
                const chatBox = document.getElementById('chat-box');
                if (chatBox.children.length <= 1) return;
                sessionStorage.setItem('fuji_chat_history', chatBox.innerHTML);
            } catch (e) { }
        }
        window.addEventListener('beforeunload', saveSession);

        window.addEventListener('load', () => {
            try {
                const saved = sessionStorage.getItem('fuji_chat_history');
                if (saved) {document.getElementById('chat-box').innerHTML = saved; scrollToBottom(true);}
            } catch (e) { }
        });

        // ===== PULL TO REFRESH =====
        let pullStartY = 0, pullActive = false;
        const chatBoxEl = document.getElementById('chat-box');
        chatBoxEl.addEventListener('touchstart', (e) => {if (chatBoxEl.scrollTop === 0) {pullStartY = e.touches[0].clientY; pullActive = true;} }, {passive: true});
        chatBoxEl.addEventListener('touchmove', (e) => {if (!pullActive) return; const diff = e.touches[0].clientY - pullStartY; if (diff > 30 && diff < 100) chatBoxEl.style.transform = `translateY(${diff * 0.4}px)`;}, {passive: true});
        chatBoxEl.addEventListener('touchend', (e) => {if (!pullActive) return; const diff = (e.changedTouches[0]?.clientY || 0) - pullStartY; chatBoxEl.style.transform = ''; pullActive = false; if (diff > 60 && chatBoxEl.scrollTop === 0) {haptic('medium'); showToast('🔄 ອັບເດດແລ້ວ');} });

        // ===== ONLINE/OFFLINE & ERROR =====
        window.addEventListener('online', () => showToast('✅ ອອນລາຍ'));
        window.addEventListener('offline', () => showToast('⚠️ ອອບລາຍ'));
        window.addEventListener('error', (e) => console.error('Global error:', e));
        window.addEventListener('unhandledrejection', (e) => console.error('Unhandled promise:', e));

        // ===== KEYBOARD =====
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {e.preventDefault(); openSuggestSheet();}
            if (e.key === 'Escape') {
                if (document.getElementById('suggest-sheet').classList.contains('open')) closeSuggestSheet();
                else {document.getElementById('user-input').value = ''; updateCharCount();}
            }
        });

        // ===== SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            const swCode = `const CACHE = 'fuji-ai-v5'; self.addEventListener('install', (e) => { self.skipWaiting(); }); self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); }); self.addEventListener('fetch', (e) => { if (e.request.method !== 'GET') return; e.respondWith(caches.match(e.request).then(cached => { return cached || fetch(e.request).then(res => { if (res.ok && e.request.url.startsWith(self.location.origin)) { const clone = res.clone(); caches.open(CACHE).then(c => c.put(e.request, clone)); } return res; }).catch(() => caches.match(e.request)); })); });`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(console.warn);
        }
    </script>
</body>
